<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Удаление продукта</title>
</head>
<body>
    <h1>Удалить продукт "{{ object.name }}"?</h1>
    <form method="post">
        {% csrf_token %}
        <p>Вы уверены, что хотите удалить этот продукт?</p>
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'catalog:product_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</body>
</html>
