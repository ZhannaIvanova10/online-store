<!DOCTYPE html>
<html>
<head>
    <title>{{ product.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1>{{ product.name }}</h1>
        
        <a href="/" class="btn btn-secondary mb-3">← На главную</a>
        
        <div class="card">
            <div class="card-body">
                <h4>Описание:</h4>
                <p>{{ product.description }}</p>
                
                <div class="row mt-4">
                    <div class="col-md-6">
                        <div class="alert alert-success">
                            <h5>Цена</h5>
                            <h3>{{ product.price }} руб.</h3>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="alert alert-warning">
                            <h5>Остаток на складе</h5>
                            <h3>{{ product.quantity }} шт.</h3>
                        </div>
                    </div>
                </div>
                <div class="mt-3">
                    <p><strong>Категория:</strong> 
                        <a href="/category/{{ product.category.id }}/products/" class="btn btn-sm btn-info">
                            {{ product.category.name }}
                        </a>
                    </p>
                </div>
            </div>
        </div>
        
        <div class="mt-4 alert alert-info">
            <h5>Эта страница кешируется на 15 минут (@cache_page)</h5>
        </div>
    </div>
</body>
</html>
