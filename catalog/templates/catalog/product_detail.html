<!DOCTYPE html>
<html>
<head>
    <title>{{ product.name }}</title>
    <meta charset="utf-8">
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
        h1 { color: #333; border-bottom: 2px solid #0066cc; padding-bottom: 10px; }
        .info { background: #f8f9fa; padding: 20px; border-radius: 5px; margin: 20px 0; }
        .actions { margin: 20px 0; }
        .btn { display: inline-block; padding: 10px 15px; margin-right: 10px; text-decoration: none; border-radius: 4px; }
        .btn-primary { background: #0066cc; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-secondary { background: #6c757d; color: white; }
    </style>
</head>
<body>
    <h1>{{ product.name }}</h1>
    <div class="info">
        <p><strong>Описание:</strong><br>{{ product.description|linebreaks }}</p>
        <p><strong>Цена:</strong> {{ product.price }} руб.</p>
        <p><strong>Создан:</strong> {{ product.created_at|date:"d.m.Y H:i" }}</p>
        <p><strong>Обновлен:</strong> {{ product.updated_at|date:"d.m.Y H:i" }}</p>
    </div>
    
    <div class="actions">
        <a href="#" class="btn btn-primary">✏️ Редактировать</a>
        <a href="{% url 'catalog:product_delete' product.pk %}" class="btn btn-danger">🗑️ Удалить</a>
        <a href="{% url 'catalog:product_list' %}" class="btn btn-secondary">← Назад к списку</a>
    </div>
</body>
</html>
