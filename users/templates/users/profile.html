<!DOCTYPE html>
<html>
<head>
    <title>Профиль - {{ user.username }}</title>
    <style>
        body { font-family: Arial; max-width: 600px; margin: 20px auto; padding: 20px; }
        .profile-card { border: 1px solid #ddd; padding: 20px; border-radius: 8px; }
        .info { margin-bottom: 10px; }
        .label { font-weight: bold; color: #555; }
    </style>
</head>
<body>
    <h1>👤 Ваш профиль</h1>
    <div class="profile-card">
        <div class="info"><span class="label">Имя пользователя:</span> {{ user.username }}</div>
        <div class="info"><span class="label">Email:</span> {{ user.email|default:"Не указан" }}</div>
        <div class="info"><span class="label">Дата регистрации:</span> {{ user.date_joined|date:"d.m.Y" }}</div>
    </div>
    <p><a href="/">Вернуться на главную</a></p>
</body>
</html>
